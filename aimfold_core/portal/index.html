<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aimfold Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0F19'/%3E%3Cg stroke='%234B5563' stroke-width='1.6' stroke-linecap='round'%3E%3Cline x1='14' y1='16' x2='34' y2='32'/%3E%3Cline x1='12' y1='26' x2='34' y2='32'/%3E%3Cline x1='12' y1='38' x2='34' y2='32'/%3E%3Cline x1='14' y1='48' x2='34' y2='32'/%3E%3C/g%3E%3Cline x1='34' y1='32' x2='50' y2='32' stroke='%232563EB' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='14' cy='16' r='2' fill='%234B5563'/%3E%3Ccircle cx='12' cy='26' r='2' fill='%234B5563'/%3E%3Ccircle cx='12' cy='38' r='2' fill='%234B5563'/%3E%3Ccircle cx='14' cy='48' r='2' fill='%234B5563'/%3E%3Ccircle cx='50' cy='32' r='4.5' fill='%232563EB'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#0B0F19; --slate:#4B5563; --border:#E5E7EB; --bg:#F7F8FA; --blue:#2563EB; --blue-dark:#1D4ED8; --blue-light:#EEF2FF;
  --white:#fff; --radius:16px; --radius-sm:11px;
  --shadow-sm:0 1px 2px rgba(11,15,25,.04), 0 2px 8px rgba(11,15,25,.04);
  --shadow-md:0 4px 16px rgba(11,15,25,.06), 0 12px 32px rgba(11,15,25,.06);
  --shadow-lg:0 16px 48px rgba(11,15,25,.14);
  --green:#059669; --green-bg:#ECFDF5; --amber:#D97706; --amber-bg:#FFFBEB;
  --red:#DC2626; --red-bg:#FEF2F2; --purple:#7C3AED; --purple-bg:#F5F3FF;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit}
code{background:#EEF0F3;padding:1px 6px;border-radius:5px;font-size:.92em}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.view-enter{animation:fadeUp .28s cubic-bezier(.2,.7,.3,1)}

.mark{display:inline-flex;align-items:center;justify-content:center}
.mark-lines{stroke:#4B5563;stroke-width:1.6;stroke-linecap:round;opacity:.6}
.mark-lines-light{stroke:rgba(255,255,255,.4);stroke-width:1.6;stroke-linecap:round}
.mark-dot{fill:#4B5563;opacity:.75}
.mark-dot-light{fill:rgba(255,255,255,.5)}
.mark-core{fill:var(--blue)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;background:
  radial-gradient(600px 320px at 12% 8%, rgba(37,99,235,.08), transparent 60%),
  radial-gradient(560px 320px at 88% 4%, rgba(37,99,235,.06), transparent 60%), var(--bg)}
.login-panel{width:min(380px,calc(100% - 32px));background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow-md)}
.login-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-bottom:22px}
.login-panel h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.login-panel p{color:var(--slate);font-size:13.5px;margin:0 0 22px}
.login-panel label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.login-panel input{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:16px}
.login-panel input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:linear-gradient(190deg,#0D1220 0%,#0B0F19 55%,#0A0D17 100%);color:#fff;padding:22px 14px;display:flex;flex-direction:column;position:relative}
.side::after{content:"";position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0))}
.side-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16.5px;padding:4px 10px 22px;letter-spacing:-.01em}
.side-tenant{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5B6478;padding:0 10px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.navlist{display:flex;flex-direction:column;gap:2px;flex:1}
.navlink{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#93A0B4;font-size:14px;font-weight:600;cursor:pointer;border:0;background:none;text-align:left;width:100%;position:relative;transition:background .15s,color .15s}
.navlink .navicon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
.navlink svg{opacity:.85;flex:none}
.navlink:hover{background:rgba(255,255,255,.05);color:#fff}
.navlink.active{background:rgba(37,99,235,.14);color:#fff}
.navlink.active .navicon{background:var(--blue);box-shadow:0 4px 14px rgba(37,99,235,.45)}
.navlink.active svg{opacity:1}
.navlink.active::before{content:"";position:absolute;left:-14px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:14px;margin-top:14px}
.userchip{display:flex;align-items:center;gap:10px;padding:6px 8px;margin-bottom:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#60A5FA);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;box-shadow:0 2px 8px rgba(37,99,235,.4)}
.usermail{font-size:12.5px;color:#B9C0CE;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signout{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.signout:hover{background:rgba(255,255,255,.1)}

.main{padding:34px 42px;min-width:0;max-width:1220px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:28px}
.page-head h1{margin:0;font-size:27px;letter-spacing:-.015em}
.page-head p{margin:5px 0 0;color:var(--slate);font-size:14.5px}
@media(max-width:920px){.shell{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;padding:12px}.navlist{flex-direction:row}.side-brand,.side-tenant,.side-foot{display:none}.main{padding:20px}}

/* ---------- shared bits ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);transition:box-shadow .18s,transform .18s}
.warn{padding:11px 13px;border-radius:var(--radius-sm);margin:8px 0;background:var(--amber-bg);color:#92400E;font-size:13px}
.empty-note{color:var(--slate);font-style:italic;font-size:13.5px}
.empty-card{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:48px 24px;color:var(--slate)}
.empty-card svg{opacity:.35}
.empty-card strong{color:var(--ink);font-size:14.5px;font-style:normal}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:13.5px;transition:transform .12s,box-shadow .12s,opacity .12s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(11,15,25,.12)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.blue{background:var(--blue);color:#fff}
.btn.blue:hover{background:var(--blue-dark)}
.btn.green{background:linear-gradient(135deg,var(--green),#0d9488);color:#fff}
.btn.secondary{background:#fff;border:1px solid var(--border);color:var(--ink)}
.btn.secondary:hover{border-color:#c7d2e0;box-shadow:0 4px 12px rgba(11,15,25,.06)}
.btn.danger{background:var(--red-bg);color:#991B1B;border:1px solid #FECACA}
.pill{padding:5px 11px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.pill.discovered,.pill.evaluating{background:#EEF0F3;color:var(--slate)}
.pill.qualified{background:#EEF2FF;color:var(--blue)}
.pill.high_priority{background:var(--amber-bg);color:var(--amber)}
.pill.actioned{background:var(--green-bg);color:var(--green)}
.pill.held{background:var(--purple-bg);color:var(--purple)}
.pill.rejected,.pill.invalid,.pill.duplicate{background:var(--red-bg);color:var(--red)}
.pill.stale,.pill.expired{background:#F4F4F5;color:#71717A}
.pill.revived{background:#ECFEFF;color:#0E7490}
.pill.active-status{background:var(--green-bg);color:var(--green)}
.pill.draft{background:#EEF0F3;color:var(--slate)}
.pill.paused{background:var(--amber-bg);color:var(--amber)}
.pill.archived{background:#F4F4F5;color:#71717A}

/* ---------- stats strip ---------- */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
@media(max-width:820px){.stats-strip{grid-template-columns:repeat(2,1fr)}}
.stat-card{display:flex;align-items:center;gap:14px;padding:18px}
.stat-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.stat-card strong{display:block;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.stat-card span{font-size:12px;color:var(--slate);font-weight:600}

/* ---------- home / opportunities list ---------- */
.opp-grid{display:grid;gap:12px}
.opp-list-item{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--border);border-left:3px solid transparent;border-radius:var(--radius-sm);padding:15px 18px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s}
.opp-list-item:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-left-color:var(--blue)}
.opp-entity-avatar{width:40px;height:40px;border-radius:10px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.opp-list-main{flex:1;min-width:0}
.opp-list-main strong{display:block;font-size:15px;letter-spacing:-.005em}
.opp-list-meta{font-size:12.5px;color:var(--slate);margin-top:2px}

/* ---------- opportunity detail (two-pane) ---------- */
.opp-shell{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:980px){.opp-shell{grid-template-columns:1fr}}
.queue-panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;max-height:calc(100vh - 160px);overflow-y:auto;position:sticky;top:20px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--border);background:#fff;color:var(--slate);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer}
.filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.queue{display:grid;gap:6px}
.opp{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;background:var(--bg);cursor:pointer;transition:background .12s}
.opp:hover{background:#EEF0F3}
.opp.active{background:var(--ink);color:#fff}
.opp-info{flex:1;min-width:0}
.opp strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp span{font-size:11px;opacity:.65}

.detail-header{display:flex;align-items:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.detail-top{flex:1;min-width:220px}
.detail-top-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.detail-top h2{margin:0;font-size:23px;letter-spacing:-.015em}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.metric{background:linear-gradient(180deg,#fff,var(--bg));border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.metric strong{display:block;font-size:21px;letter-spacing:-.02em}
.metric span{font-size:11.5px;color:var(--slate);font-weight:600}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qa .full{grid-column:1/-1}
.qa h3{font-size:12.5px;margin:0 0 8px;color:var(--slate);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.qa p{margin:0;font-size:14px;line-height:1.5}
.evidence-item{padding:9px 11px;border-radius:9px;margin-bottom:7px;font-size:13px;line-height:1.4;border:1px solid var(--border)}
.evidence-item.observed{background:var(--green-bg);border-color:#A7F3D0}
.evidence-item.inference{background:var(--purple-bg);border-color:#DDD6FE;font-style:italic}
.evidence-badge{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;border-radius:999px;margin-right:7px}
.evidence-badge.observed{background:var(--green);color:#fff}
.evidence-badge.inference{background:var(--purple);color:#fff}
.dims{display:grid;gap:10px}
.dim{display:grid;grid-template-columns:150px 1fr auto;gap:9px;align-items:center;font-size:12.5px}
.dim .bar{height:8px;border-radius:999px;background:var(--border);overflow:hidden}
.dim .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#60A5FA);border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.dim .pts{font-weight:700;text-align:right;min-width:52px}
.dim .rationale{grid-column:1/-1;color:var(--slate);font-size:11.5px;margin-top:-3px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}

/* ---------- aims / activity / settings tables ---------- */
.aim-card{display:flex;align-items:center;gap:16px;padding:18px}
.aim-icon{width:44px;height:44px;border-radius:11px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.aim-card strong{font-size:15.5px}
.aim-meta{font-size:12.5px;color:var(--slate);margin-top:3px}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);padding:10px 20px;border-bottom:1px solid var(--border);font-weight:700}
.table td{padding:13px 20px;font-size:13.5px;border-bottom:1px solid var(--border)}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .12s}
.table tbody tr:hover{background:var(--bg)}

/* ---------- insights ---------- */
.insight-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:820px){.insight-grid{grid-template-columns:repeat(2,1fr)}}
.insight-card{display:flex;align-items:center;gap:14px;padding:18px}
.insight-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.insight-card strong{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.insight-card span{font-size:12px;color:var(--slate);font-weight:600}
.chart-row{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;font-size:13px;padding:9px 0}
.chart-row .bar-track{height:12px;border-radius:999px;background:var(--bg);overflow:hidden}
.chart-row .bar-fill{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.chart-row .count{font-weight:700;min-width:24px;text-align:right}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:50vh;color:var(--slate);font-size:14.5px;text-align:center}
.empty-state svg{opacity:.3}

/* ---------- create-aim modal ---------- */
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-overlay{position:fixed;inset:0;background:rgba(11,15,25,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;animation:overlayIn .15s ease}
.modal{width:min(640px,100%);max-height:85vh;overflow-y:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);animation:modalIn .2s cubic-bezier(.2,.7,.3,1)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:19px;letter-spacing:-.01em}
.modal-head p{margin:3px 0 0;font-size:13px;color:var(--slate)}
.modal-close{width:32px;height:32px;border-radius:9px;border:0;background:var(--bg);color:var(--slate);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.modal-close:hover{background:var(--border);color:var(--ink)}
.modal-body{padding:24px 26px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field .hint{font-size:12px;color:var(--slate);margin-top:6px}
.field input[type=text],.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;resize:vertical}
.field input[type=text]:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.compile-loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 20px;color:var(--slate);text-align:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.compiled-preview{display:grid;gap:16px}
.compiled-preview h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--slate);margin:0 0 8px;font-weight:700}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--blue-light);color:var(--blue);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.criteria-list{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6}
.criteria-list li{margin-bottom:3px}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap" style="display:none">
  <form class="login-panel" id="loginForm">
    <div class="login-brand">
      <svg width="26" height="26" viewBox="0 0 64 64" class="mark">
        <g class="mark-lines"><line x1="14" y1="16" x2="34" y2="32"/><line x1="12" y1="26" x2="34" y2="32"/><line x1="12" y1="38" x2="34" y2="32"/><line x1="14" y1="48" x2="34" y2="32"/></g>
        <line x1="34" y1="32" x2="50" y2="32" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>
        <circle class="mark-dot" cx="14" cy="16" r="2.2"/><circle class="mark-dot" cx="12" cy="26" r="2.2"/><circle class="mark-dot" cx="12" cy="38" r="2.2"/><circle class="mark-dot" cx="14" cy="48" r="2.2"/>
        <circle class="mark-core" cx="50" cy="32" r="5"/>
      </svg>
      <span>Aimfold</span>
    </div>
    <h1>Sign in to your portal</h1>
    <p>Aims, opportunities, and everything Aimfold has found for your tenant.</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" required autocomplete="username">
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" required autocomplete="current-password">
    <button class="btn blue" style="width:100%" type="submit" id="loginBtn">Sign in</button>
    <div id="loginError" class="warn" style="display:none;margin-top:14px"></div>
  </form>
</div>

<div class="shell" id="app" style="display:none">
  <aside class="side">
    <div class="side-brand">
      <svg width="24" height="24" viewBox="0 0 64 64" class="mark">
        <g class="mark-lines-light"><line x1="14" y1="16" x2="34" y2="32"/><line x1="12" y1="26" x2="34" y2="32"/><line x1="12" y1="38" x2="34" y2="32"/><line x1="14" y1="48" x2="34" y2="32"/></g>
        <line x1="34" y1="32" x2="50" y2="32" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>
        <circle class="mark-dot-light" cx="14" cy="16" r="2.2"/><circle class="mark-dot-light" cx="12" cy="26" r="2.2"/><circle class="mark-dot-light" cx="12" cy="38" r="2.2"/><circle class="mark-dot-light" cx="14" cy="48" r="2.2"/>
        <circle class="mark-core" cx="50" cy="32" r="5"/>
      </svg>
      <span>Aimfold</span>
    </div>
    <div class="side-tenant" id="tenantLabel">Loading tenant…</div>
    <nav class="navlist" id="navlist"></nav>
    <div class="side-foot">
      <div class="userchip"><span class="avatar" id="userAvatar">?</span><span class="usermail" id="userEmail"></span></div>

function esc(v){ return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m])); }
function pct(v){ return (v===null||v===undefined) ? "-" : Math.round(Number(v)*100) + "%"; }
function fmtDate(v){ if(!v) return "-"; const d = new Date(v); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function initials(name){ return String(name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }

function scoreColor(score){
  if(score>=80) return "#059669";
  if(score>=50) return "#2563EB";
  if(score>=30) return "#D97706";
  return "#DC2626";
}

// Reusable SVG circular score ring — used on Home cards, the queue, and
// the opportunity detail header, so a score always reads the same way
// everywhere in the portal.
function scoreRing(score, size, showText){
  showText = showText !== false;
  const stroke = size < 32 ? 3 : 5;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const frac = Math.max(0, Math.min(100, score || 0)) / 100;
  const offset = c * (1 - frac);
  const color = scoreColor(score || 0);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E5E7EB" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 ${size/2} ${size/2})"
      style="transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.3,1)"/>
    ${showText ? `<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${Math.round(size*0.32)}" font-weight="800" fill="#0B0F19" font-family="Inter,sans-serif">${Math.round(score||0)}</text>` : ""}
  </svg>`;
}

function iconWrap(svgInner, bg, color, size){
  size = size || 42;
  return `<div style="width:${size}px;height:${size}px;border-radius:11px;background:${bg};color:${color};display:flex;align-items:center;justify-content:center;flex:none">
    <svg width="${Math.round(size*0.48)}" height="${Math.round(size*0.48)}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${svgInner}</svg>
  </div>`;
}

function emptyCard(svgInner, title, note){
  return `<div class="card empty-card">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${'#4B5563'}" stroke-width="1.5">${svgInner}</svg>
    <div><strong>${esc(title)}</strong><div class="empty-note" style="margin-top:4px">${esc(note)}</div></div>
  </div>`;
}

function greeting(){
  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}

// ---------------- auth ----------------

function showLogin(message){
  document.getElementById("app").style.display = "none";
  document.getElementById("loginScreen").style.display = "grid";
  const err = document.getElementById("loginError");
  if(message){ err.textContent = message; err.style.display = "block"; } else { err.style.display = "none"; }
}

async function showApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "grid";
  const { data:{ user } } = await sb.auth.getUser();
  currentUser = user;
  document.getElementById("userEmail").textContent = user?.email || "";
  document.getElementById("userAvatar").textContent = (user?.email || "?").slice(0,1).toUpperCase();
  await loadTenantInfo();
  renderNav();
  navigate("home");
}

document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "Signing in…";
  try{
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    // onAuthStateChange below fires on SIGNED_IN and calls showApp() —
    // don't also call it here (aimfold_core/inbox/index.html's history
    // has the exact race this avoids: two showApp() calls racing two
    // loadQueue() fetches left `selected` pointing at a stale object).
  }catch(err){
    showLogin(err.message || "Sign in failed.");
  }finally{
    btn.disabled = false; btn.textContent = "Sign in";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await sb.auth.signOut();
  opportunities = aims = activityFeed = tenantInfo = selectedOpp = null;
  showLogin();
});

sb.auth.onAuthStateChange((_e, session)=>{ if(session) showApp(); else showLogin(); });
(async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) showApp(); else showLogin();
})();

function renderNav(){
  document.getElementById("navlist").innerHTML = NAV.map(n => `

      ${n.label}

}

window.navigate = function(id){
  view = id;

async function loadTenantInfo(){
  // A user can belong to more than one tenant (tenant_members is many-to-many)
  // — this portal shows the first membership found, same simplification the
  // rest of this session's UIs make (single-tenant-per-session assumption).
  const { data, error } = await sb.from("tenant_members").select("tenant_id, role, tenants(name, status)").limit(1);
  if(error || !data || !data.length){
    tenantInfo = null;
    document.getElementById("tenantLabel").textContent = "No tenant membership found";
    return;
  }
  tenantInfo = { tenantId: data[0].tenant_id, role: data[0].role, name: data[0].tenants?.name, status: data[0].tenants?.status };
  document.getElementById("tenantLabel").textContent = tenantInfo.name || "Tenant";
}

// ---------------- shared data loads ----------------

async function ensureOpportunities(){
  if(opportunities) return opportunities;
  const { data, error } = await sb.from("opportunities").select(`
      *,
      entity:primary_entity_id(name,domain),
      aim:aim_id(name),
      opportunity_signals(contribution_note, signal:signal_id(title,description,source_url,extracted_evidence,published_at))
    `).order("total_score",{ascending:false});
  if(error){ console.error("Failed to load opportunities:", error.message); opportunities = { error: "Couldn't load your opportunities right now. Please try again in a moment." }; return opportunities; }
  opportunities = data || [];
  return opportunities;
}

async function ensureAims(){
  if(aims) return aims;
  const { data, error } = await sb.from("aims").select("id,name,opportunity_type,status,created_at").order("created_at",{ascending:false});
  if(error){ console.error("Failed to load Aims:", error.message); aims = { error: "Couldn't load your Aims right now. Please try again in a moment." }; return aims; }
  aims = data || [];
  return aims;
}

async function ensureActivity(){
  if(activityFeed) return activityFeed;
  const { data, error } = await sb.from("feedback")
    .select("id,feedback_type,rejection_reason,created_at,predicted_total_score,opportunity:opportunity_id(id),aim:aim_id(name)")
    .order("created_at",{ascending:false}).limit(50);
  if(error){ console.error("Failed to load activity:", error.message); activityFeed = { error: "Couldn't load your activity right now. Please try again in a moment." }; return activityFeed; }
  activityFeed = data || [];
  return activityFeed;
}

// ---------------- OPPORTUNITIES (queue + detail, the proven inbox flow) ----------------

async function renderOpportunities(openId){
  const list = await ensureOpportunities();
  const main = document.getElementById("main");
  if(list.error){ main.innerHTML = `<div class="warn">${esc(list.error)}</div>`; return; }
  if(openId) selectedOpp = list.find(o=>o.id===openId) || selectedOpp;
  if(!selectedOpp){ const visible = filteredOpportunities(list); if(visible.length) selectedOpp = visible[0]; }

  main.innerHTML = `
    <div class="page-head view-enter"><div><h1>Opportunities</h1><p>Inspect why each one matters, then act or skip.</p></div></div>
    <div class="opp-shell view-enter">
      <div class="queue-panel">
        <div class="filters" id="filters"></div>
        <div class="queue" id="queue"></div>
      </div>
      <div id="detailPane">${selectedOpp ? "" : `<div class="empty-state"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="1.5"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 6.9L12 17.3 5.7 20.8l1.7-6.9L2 9.2l7.1-.6z"/></svg>Select an opportunity from the queue.</div>`}</div>
    </div>`;
  renderFilters();
  renderQueue();
  if(selectedOpp) renderDetail();
}

function filteredOpportunities(list){
  list = list || opportunities;
  if(activeFilter==="all") return list;
  return list.filter(o=>o.lifecycle_state===activeFilter);
}

function renderFilters(){
  document.getElementById("filters").innerHTML = LIFECYCLE_FILTERS.map(f=>
    `<button class="${f===activeFilter?'active':''}" onclick="setFilter('${f}')">${esc(f.replace(/_/g,' '))}</button>`).join("");
}
window.setFilter = function(f){ activeFilter = f; renderFilters(); renderQueue(); }

function renderQueue(){
  const visible = filteredOpportunities();
  document.getElementById("queue").innerHTML = visible.map(o=>`
    <div class="opp ${selectedOpp?.id===o.id?'active':''}" onclick="selectOpportunity('${o.id}')">
      ${scoreRing(o.total_score, 30, false)}
      <div class="opp-info">
        <strong>${esc(o.entity?.name || "Unknown entity")}</strong>
        <span>${esc(o.lifecycle_state.replace(/_/g,' '))} · ${esc(o.aim?.name || "")}</span>
      </div>
    </div>`).join("") || "<div style='opacity:.7;padding:10px;font-size:13px'>No opportunities in this view.</div>";
}

window.selectOpportunity = function(id){
  selectedOpp = opportunities.find(x=>x.id===id);
  renderQueue();
  renderDetail();
}

function renderDetail(){
  const o = selectedOpp;
  const items = [];
  (o.opportunity_signals || []).forEach(link=>{
    (link.signal?.extracted_evidence || []).forEach(e=>{
      if(e.type === "observed_fact" || e.type === "stage1_match") items.push({kind:"observed", text: e.text || `"${e.matched_text}" (${e.label})`});
      else if(e.type === "inference") items.push({kind:"inference", text: e.text});
    });
  });
  const dims = o.component_scores || [];
  const humanControlled = ["actioned","held","rejected","duplicate","invalid"].includes(o.lifecycle_state);

  document.getElementById("detailPane").innerHTML = `
    <div class="card view-enter">
      <div class="detail-header">
        ${scoreRing(o.total_score, 72)}
        <div class="detail-top">
          <div class="detail-top-row">
            <h2>${esc(o.entity?.name || "Unknown entity")}</h2>
            <span class="pill ${esc(o.lifecycle_state)}">${esc(o.lifecycle_state.replace(/_/g,' '))}</span>
          </div>
          <div style="color:var(--slate);font-size:13.5px">${esc(o.aim?.name || "Unknown Aim")} · ${esc(o.opportunity_type.replace(/_/g,' '))}${o.entity?.domain ? ` · ${esc(o.entity.domain)}` : ""}</div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><strong>${pct(o.confidence)}</strong><span>Confidence</span></div>
        <div class="metric"><strong>${pct(o.evidence_confidence)}</strong><span>Evidence confidence</span></div>
        <div class="metric"><strong>${pct(o.source_confidence)}</strong><span>Source confidence</span></div>
      </div>
      <div class="qa">
        <div><h3>Why this?</h3><p class="${o.relevance_explanation?'':'empty-note'}">${esc(o.relevance_explanation || "No relevance explanation recorded yet.")}</p></div>
        <div><h3>Why now?</h3><p class="${o.why_now?'':'empty-note'}">${esc(o.why_now || "No timing signal recorded.")}</p></div>
        <div class="full"><h3>What proves it?</h3>
          ${items.length ? items.map(i=>`<div class="evidence-item ${i.kind}"><span class="evidence-badge ${i.kind}">${i.kind==='observed'?'Observed':'AI inference'}</span>${esc(i.text)}</div>`).join("") : `<p class="empty-note">No structured evidence linked yet.</p>`}
        </div>
        <div class="full"><h3>Score breakdown</h3>
          <div class="dims">${dims.length ? dims.map(d=>`
            <div class="dim"><span>${esc(d.name.replace(/_/g,' '))}</span><span class="bar"><i style="width:${Math.round((d.raw_value||0)*100)}%"></i></span><span class="pts">${(d.points||0).toFixed(1)}/${d.weight}</span><span class="rationale">${esc(d.rationale || "")}</span></div>`).join("") : "<p class='empty-note'>No score breakdown recorded yet.</p>"}</div>
        </div>
        <div class="full">
          <h3>What next?</h3>
          <p class="${o.recommended_action?'':'empty-note'}">${o.recommended_action ? `<strong>${esc(o.recommended_action.replace(/_/g,' '))}</strong> — ${esc(o.recommended_action_rationale || "")}` : "No recommended action yet."}</p>
          <div class="actions">
            <button class="btn green" id="approveBtn" ${humanControlled?'disabled':''}>Approve</button>
            <button class="btn secondary" id="holdBtn" ${humanControlled?'disabled':''}>Hold</button>
            <button class="btn danger" id="rejectBtn" ${humanControlled?'disabled':''}>Reject</button>
          </div>
          <div id="rejectReasonRow" style="display:none;margin-top:14px">
            <label style="display:block;font-weight:700;font-size:13px;margin-bottom:6px">Why? (required)</label>
            <select id="rejectReasonSelect" style="width:100%;padding:11px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;font-size:14px">
              ${REJECTION_REASONS.map(r=>`<option value="${r}">${r.replace(/_/g,' ')}</option>`).join("")}
            </select>
            <div class="actions"><button class="btn danger" id="confirmRejectBtn">Confirm reject</button><button class="btn secondary" id="cancelRejectBtn">Cancel</button></div>
          </div>
        </div>
      </div>
    </div>`;

  document.getElementById("approveBtn")?.addEventListener("click", ()=> recordDecision("accepted","actioned"));
  document.getElementById("holdBtn")?.addEventListener("click", ()=> recordDecision("held","held"));
  document.getElementById("rejectBtn")?.addEventListener("click", ()=>{ document.getElementById("rejectReasonRow").style.display = "block"; });
  document.getElementById("cancelRejectBtn")?.addEventListener("click", ()=>{ document.getElementById("rejectReasonRow").style.display = "none"; });
  document.getElementById("confirmRejectBtn")?.addEventListener("click", ()=>{
    recordDecision("rejected","rejected", document.getElementById("rejectReasonSelect").value);
  });
}

// feedback_type is the human's judgment; lifecycle_state is the
// opportunity's own bookkeeping state — see
// 20260819120800_feedback_outcomes_schema.sql's header. Same real write
// path as aimfold_core/inbox/index.html, unmodified.
async function recordDecision(feedbackType, toState, rejectionReason){
  const o = selectedOpp;
  if(!o) return;
  const fromState = o.lifecycle_state;
  const predictionSnapshot = {
    predicted_total_score: o.total_score, predicted_confidence: o.confidence,
    predicted_recommended_action: o.recommended_action, predicted_lifecycle_state: fromState,
    aim_version_id: o.aim_version_id, scoring_version: o.scoring_version
  };
  const { error: updateError } = await sb.from("opportunities").update({lifecycle_state: toState}).eq("id", o.id);
  if(updateError){ console.error("Failed to update opportunity:", updateError.message); alert("Something went wrong saving that — please try again."); return; }
  const { error: eventError } = await sb.from("opportunity_lifecycle_events").insert({
    tenant_id: o.tenant_id, opportunity_id: o.id, from_state: fromState, to_state: toState,
    reason: `Operator action from Aimfold Portal (was ${fromState}).`
  });
  if(eventError){ console.error("Failed to log lifecycle event:", eventError.message); alert("Something went wrong saving that — please try again."); return; }
  const { error: feedbackError } = await sb.from("feedback").insert({
    tenant_id: o.tenant_id, aim_id: o.aim_id, opportunity_id: o.id,
    user_id: currentUser?.id || null, feedback_type: feedbackType, rejection_reason: rejectionReason || null,
    ...predictionSnapshot
  });
  if(feedbackError){ console.error("Failed to record feedback:", feedbackError.message); alert("Something went wrong saving that — please try again."); return; }

  o.lifecycle_state = toState;
  activityFeed = null; // stale now — reload next time Activity is viewed
  document.getElementById("rejectReasonRow").style.display = "none";
  renderQueue();
  renderDetail();
}

// ---------------- INSIGHTS ----------------
// Simple, real, client-computed aggregates over already-fetched data —
// NOT a port of aimfold_core/analytics (PR14)'s full rollup, which needs
// a backend to run. Honest approximation: counts/rates only, computed
// live from whatever this session can actually see under RLS.

const LIFECYCLE_COLORS = {
  discovered:"#4B5563", evaluating:"#4B5563", qualified:"#2563EB", high_priority:"#D97706",
  actioned:"#059669", held:"#7C3AED", rejected:"#DC2626", invalid:"#DC2626", duplicate:"#DC2626",
  stale:"#71717A", expired:"#71717A", revived:"#0E7490"
};

async function renderInsights(){
  const list = await ensureOpportunities();
  const main = document.getElementById("main");
  if(list.error){ main.innerHTML = `<div class="warn">${esc(list.error)}</div>`; return; }
  const total = list.length;
  const accepted = list.filter(o=>o.lifecycle_state==='actioned').length;
  const rejected = list.filter(o=>o.lifecycle_state==='rejected').length;
  const avgScore = total ? Math.round(list.reduce((s,o)=>s+(o.total_score||0),0)/total) : 0;
  const acceptRate = total ? Math.round((accepted/total)*100) : 0;

  const counts = {};
  list.forEach(o => { counts[o.lifecycle_state] = (counts[o.lifecycle_state]||0) + 1; });
  const rows = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const maxCount = rows.length ? rows[0][1] : 1;

  main.innerHTML = `
    <div class="page-head view-enter"><div><h1>Insights</h1><p>A lightweight, live view over what's currently visible to you — see the note below for the full analytics engine.</p></div></div>
    <div class="insight-grid view-enter">
      <div class="card insight-card">${iconWrap('<path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 6.9L12 17.3 5.7 20.8l1.7-6.9L2 9.2l7.1-.6z"/>','var(--blue-light)','var(--blue)')}<div><strong>${total}</strong><span>Total opportunities</span></div></div>
      <div class="card insight-card">${iconWrap('<path d="M4 19V9M11 19V4M18 19v-7"/>','var(--purple-bg)','var(--purple)')}<div><strong>${avgScore}</strong><span>Average score</span></div></div>
      <div class="card insight-card">${iconWrap('<path d="M20 6 9 17l-5-5"/>','var(--green-bg)','var(--green)')}<div><strong>${acceptRate}%</strong><span>Accepted rate</span></div></div>
      <div class="card insight-card">${iconWrap('<path d="M18 6 6 18M6 6l12 12"/>','var(--red-bg)','var(--red)')}<div><strong>${rejected}</strong><span>Rejected</span></div></div>
    </div>
    <div class="card view-enter" style="margin-bottom:16px">
      <h3 style="margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--slate)">Opportunities by stage</h3>
      ${rows.length ? rows.map(([state,count])=>{
        const color = LIFECYCLE_COLORS[state] || "#4B5563";
        return `<div class="chart-row">
          <span>${esc(state.replace(/_/g,' '))}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${Math.round((count/maxCount)*100)}%;background:${color}"></span></span>
          <span class="count" style="color:${color}">${count}</span>
        </div>`;
      }).join("") : `<p class="empty-note">No opportunities yet.</p>`}
    </div>
    <div class="card empty-note">A deeper performance report — funnel breakdown, outcome trends, cost per accepted opportunity — is on the way. This view shows what can be calculated instantly from what's already loaded here.</div>`;
}

// ---------------- CREATE AIM (real Aim Compiler call + real persistence) ----------------
// Two real network calls, no fabrication anywhere in between:
//   1. POST {COMPILER_URL}/aims/compile — the actual aim_compiler service
//      (PR4), a real LLM call. Returns a proposal; nothing is written yet.
//   2. On approve, POST {COMPILER_URL}/aims/propose with the exact
//      compiled_spec this page received (never hand-edited) — the server
//      re-validates it via the same CompiledAimSpec Pydantic model, checks
//      the caller really belongs to this tenant, and only then persists
//      aims + aim_versions via a service-role key the browser never sees.

let createAimStep = "form"; // 'form' | 'loading' | 'preview' | 'saving'
let createAimResult = null; // AimCompilationResult from /aims/compile

window.openCreateAimModal = function(){
  createAimStep = "form";
  createAimResult = null;
  renderCreateAimModal();
}

window.closeCreateAimModal = function(){
  document.getElementById("modalRoot").innerHTML = "";
}

function renderCreateAimModal(){
  const root = document.getElementById("modalRoot");
  let body;

  if(createAimStep === "form"){
    body = `
      <div class="field">
        <label for="aimNameInput">Name this Aim</label>
        <input type="text" id="aimNameInput" placeholder="e.g. Finance Transformation Career Search" value="${esc(document.getElementById('aimNameInput')?.value || '')}">
      </div>
      <div class="field">
        <label for="aimIntentInput">What should Aimfold watch for?</label>
        <textarea id="aimIntentInput" rows="4" placeholder="Describe it in plain language — e.g. &quot;Find companies with signs of AR/collections problems: manual processes, high overdue volume, disputes.&quot;">${esc(document.getElementById('aimIntentInput')?.value || '')}</textarea>
        <div class="hint">Be specific — the more detail you give, the sharper Aimfold's first pass will be.</div>
      </div>
      <div id="createAimError"></div>
      <div class="actions">
        <button class="btn blue" onclick="submitCompile()">Compile with Aimfold</button>
        <button class="btn secondary" onclick="closeCreateAimModal()">Cancel</button>
      </div>`;
  } else if(createAimStep === "loading"){
    body = `<div class="compile-loading"><div class="spinner"></div><div>Aimfold is thinking this through — usually takes 5-20 seconds.</div></div>`;
  } else if(createAimStep === "preview" || createAimStep === "saving"){
    const r = createAimResult;
    const spec = r.compiled_spec;
    body = `
      <div class="compiled-preview">
        <div class="card empty-note" style="font-style:normal">${esc(r.explanation)}</div>
        <div>
          <h3>Objective</h3>
          <p style="margin:0;font-size:14px">${esc(spec.objective)}</p>
        </div>
        <div>
          <h3>Looking for</h3>
          <div class="tag-list">${spec.target_entity_types.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        </div>
        <div>
          <h3>Positive criteria</h3>
          <ul class="criteria-list">${spec.positive_criteria.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
        </div>
        <div>
          <h3>Scoring weights</h3>
          <div class="dims">${spec.scoring_weights.map(w=>`
            <div class="dim"><span>${esc(w.label)}</span><span class="bar"><i style="width:${w.points}%"></i></span><span class="pts">${w.points} pts</span></div>`).join("")}</div>
        </div>
        <div>
          <h3>Likely actions</h3>
          <div class="tag-list">${spec.likely_actions.map(a=>`<span class="tag">${esc(a.replace(/_/g,' '))}</span>`).join("")}</div>
        </div>
        <div class="empty-note">Qualification threshold: ${spec.confidence_thresholds.qualified_signal_min_score}/100 · Geography: ${esc(spec.geography.join(", "))}</div>
      </div>
      <div id="createAimError" style="margin-top:14px"></div>
      <div class="actions" style="margin-top:18px">
        <button class="btn green" onclick="submitPropose()" ${createAimStep==='saving'?'disabled':''}>${createAimStep==='saving'?'Creating…':'Approve & Create Aim'}</button>
        <button class="btn secondary" onclick="createAimStep='form';renderCreateAimModal()" ${createAimStep==='saving'?'disabled':''}>Back</button>
        <button class="btn secondary" onclick="closeCreateAimModal()" ${createAimStep==='saving'?'disabled':''}>Cancel</button>
      </div>`;
  }

  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this && createAimStep!=='saving') closeCreateAimModal()">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h2>New Aim</h2>
            <p>Describe a goal — Aimfold compiles it into something it can watch for.</p>
          </div>
          <button class="modal-close" onclick="if(createAimStep!=='saving') closeCreateAimModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-body">${body}</div>
      </div>
    </div>`;
}

window.submitCompile = async function(){
  const name = document.getElementById("aimNameInput").value.trim();
  const intent = document.getElementById("aimIntentInput").value.trim();
  if(!name || !intent){
    document.getElementById("createAimError").innerHTML = `<div class="warn">Give this Aim a name and describe what it should watch for.</div>`;
    return;
  }
  createAimStep = "loading";
  renderCreateAimModal();
  try{
    const resp = await fetch(`${COMPILER_URL}/aims/compile`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ raw_user_intent: intent }),
    });
    if(!resp.ok){
      const detail = await resp.json().catch(()=>({}));
      console.error("Aim compile request failed:", resp.status, detail.detail); // technical detail stays in the console, not the UI
      throw new Error("couldn't process that");
    }
    createAimResult = await resp.json();
    createAimResult._aimName = name;
    createAimStep = "preview";
    renderCreateAimModal();
  }catch(err){
    createAimStep = "form";
    renderCreateAimModal();
    document.getElementById("aimNameInput").value = name;
    document.getElementById("aimIntentInput").value = intent;
    document.getElementById("createAimError").innerHTML = `<div class="warn">Aimfold couldn't process that just now. Please try again in a moment.</div>`;
  }
}

window.submitPropose = async function(){
  createAimStep = "saving";
  renderCreateAimModal();
  try{
    const { data: sessionData } = await sb.auth.getSession();
    const accessToken = sessionData?.session?.access_token;
    if(!accessToken || !tenantInfo) throw new Error("please sign in again");

    const resp = await fetch(`${COMPILER_URL}/aims/propose`, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": `Bearer ${accessToken}`},
      body: JSON.stringify({
        tenant_id: tenantInfo.tenantId,
        aim_name: createAimResult._aimName,
        raw_user_intent: createAimResult.raw_user_intent,
        compiled_spec: createAimResult.compiled_spec,
        compiler_model: createAimResult.compiler_model,
        compiler_prompt_version: createAimResult.compiler_prompt_version,
      }),
    });
    if(!resp.ok){
      const detail = await resp.json().catch(()=>({}));
      console.error("Aim propose request failed:", resp.status, detail.detail); // technical detail stays in the console, not the UI
      throw new Error("couldn't save");
    }
    aims = null; // stale cache — Aims view refetches
    closeCreateAimModal();
    navigate("aims");
  }catch(err){
    createAimStep = "preview";
    renderCreateAimModal();
    const friendly = err.message === "please sign in again" ? "Your session's expired — please sign in again." : "Aimfold couldn't save this Aim just now. Please try again.";
    document.getElementById("createAimError").innerHTML = `<div class="warn">${esc(friendly)}</div>`;
  }
}
</script>
