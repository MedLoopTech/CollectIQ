name: CollectIQ CI

on:
  pull_request:
  push:
    branches:
      - master
      - feat/recovery-sprint-command-center

jobs:
  audit-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02_audit_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile collectiq_engine.py api.py
      - run: python test_golden.py

  agent-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08_agent_foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile api.py llm_provider.py audit_agent.py manager_agent.py research_agent.py outreach_agent.py sales_agent.py recovery_agent.py cfo_agent.py
      - run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import api
          client = TestClient(api.app)
          r = client.get('/health')
          assert r.status_code == 200, r.text
          assert r.json().get('ok') is True, r.json()
          print(r.json())
          PY

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config >/dev/null
